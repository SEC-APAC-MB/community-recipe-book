name: Keep Repository Public and Secure

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  administration: write
  pages: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure repository is public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          VISIBILITY=$(gh repo view "$REPO" --json visibility --jq '.visibility' 2>/dev/null || echo "unknown")
          echo "Repository visibility: $VISIBILITY"
          if [ "$VISIBILITY" != "PUBLIC" ]; then
            echo "::warning::Repository is $VISIBILITY — changing to PUBLIC"
            gh repo edit "$REPO" --visibility public --accept-visibility-change-consequences
            echo "✅ Repository set to PUBLIC"
          else
            echo "✅ Repository is PUBLIC"
          fi

      - name: Ensure GitHub Pages is enabled and configured
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          PAGES_STATUS=$(gh api "repos/$REPO/pages" --jq '.status' 2>/dev/null || echo "not-found")
          echo "Pages status: $PAGES_STATUS"
          if [ "$PAGES_STATUS" = "not-found" ] || [ -z "$PAGES_STATUS" ]; then
            echo "⚠️ Pages not configured — enabling..."
            gh api "repos/$REPO/pages" -X POST \
              --input - <<'EOF'
          {
            "build_type": "workflow",
            "source": {
              "branch": "main",
              "path": "/"
            }
          }
          EOF
            echo "✅ Pages enabled"
          else
            echo "✅ Pages already configured"
          fi

      - name: Verify HTTPS enforcement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          HTTPS_ENFORCED=$(gh api "repos/$REPO/pages" --jq '.https_enforced' 2>/dev/null || echo "unknown")
          echo "HTTPS enforced: $HTTPS_ENFORCED"
          if [ "$HTTPS_ENFORCED" != "true" ]; then
            echo "::warning::HTTPS not enforced on Pages — should enable for security"
          else
            echo "✅ HTTPS enforcement active"
          fi

      - name: Verify site is live
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SITE_URL="https://sec-apac-mb.github.io/community-recipe-book/"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL" 2>/dev/null || echo "000")
          echo "Site HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "301" ] || [ "$HTTP_CODE" = "302" ]; then
            echo "✅ Site is live"
          else
            echo "⚠️ Site returned HTTP $HTTP_CODE — triggering deployment"
            gh workflow run pages.yml --repo "${{ github.repository }}" 2>/dev/null || true
          fi