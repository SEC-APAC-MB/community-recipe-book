name: Monitor Pages Health

on:
  schedule:
    # Every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

jobs:
  check-and-redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check page health
        id: health
        run: |
          URL="https://sec-apac-mb.github.io/community-recipe-book/"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 15 "$URL" || echo "000")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "Page returned HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Page returned $STATUS, will attempt redeploy"
            echo "needs_redeploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Page is healthy"
            echo "needs_redeploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure repo is public
        if: steps.health.outputs.needs_redeploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          VISIBILITY=$(gh repo view "$REPO" --json visibility --jq '.visibility')
          echo "Current visibility: $VISIBILITY"
          if [ "$VISIBILITY" != "PUBLIC" ]; then
            gh repo edit "$REPO" --visibility public --accept-visibility-change-consequences
            echo "Repository changed to PUBLIC"
          fi

      - name: Ensure Pages is enabled
        if: steps.health.outputs.needs_redeploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          PAGES=$(gh api "repos/$REPO/pages" --jq '.status' 2>/dev/null || echo "not-found")
          if [ "$PAGES" = "not-found" ] || [ -z "$PAGES" ]; then
            echo "Pages disabled, re-enabling..."
            gh api "repos/$REPO/pages" -X POST \
              -f build_type=workflow \
              -f source.branch=main \
              -f source.path=/ || true
          fi

      - name: Trigger redeploy
        if: steps.health.outputs.needs_redeploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          echo "Triggering Pages workflow..."
          gh workflow run pages.yml --repo "$REPO" || true
          echo "Redeploy triggered"

      - name: Verify after redeploy
        if: steps.health.outputs.needs_redeploy == 'true'
        run: |
          URL="https://sec-apac-mb.github.io/community-recipe-book/"
          sleep 60
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 15 "$URL" || echo "000")
          echo "After redeploy: HTTP $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "::notice::Page restored successfully"
          else
            echo "::error::Page still failing after redeploy (HTTP $STATUS)"
          fi
