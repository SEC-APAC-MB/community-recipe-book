name: Process Recipe Submission

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  process-recipe:
    # Only process issues with the "recipe" label
    if: contains(github.event.issue.labels.*.name, 'recipe')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse recipe from issue body
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 .github/scripts/parse_recipe.py "$ISSUE_BODY"

      - name: Add recipe to recipes.json
        if: steps.parse.outputs.success == 'true'
        run: |
          python3 .github/scripts/add_recipe.py

      - name: Commit and push
        if: steps.parse.outputs.success == 'true'
        run: |
          git config user.name "Recipe Bot"
          git config user.email "recipe-bot@users.noreply.github.com"
          git add public/recipes.json
          git diff --cached --quiet || git commit -m "recipe: add ${{ steps.parse.outputs.recipe_name }} [skip ci]"
          git push

      - name: Comment on issue
        if: steps.parse.outputs.success == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '🎉 Your recipe **${{ steps.parse.outputs.recipe_name }}** has been added to the community recipe book! It will appear on the site after the next deployment.\n\n👉 [View Recipe Book](https://sec-apac-mb.github.io/community-recipe-book/)'
            })

      - name: Close issue
        if: steps.parse.outputs.success == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            })

      - name: Comment on issue if parsing failed
        if: steps.parse.outputs.success == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '⚠️ We couldn\'t parse this recipe submission. Please make sure you used the submission template with all required fields (Recipe name, Serves, Prep time, Cook time, Ingredients, Method). You can edit the issue to fix it and we\'ll try again.'
            })