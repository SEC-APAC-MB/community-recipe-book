name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Security check: ensure repo is public and Pages is configured
  verify-public:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure repository is public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          VISIBILITY=$(gh repo view "$REPO" --json visibility --jq '.visibility' 2>/dev/null || echo "unknown")
          echo "Repository visibility: $VISIBILITY"
          if [ "$VISIBILITY" != "PUBLIC" ]; then
            echo "::warning::Repository is $VISIBILITY — GitHub Pages on free plan requires public visibility"
          fi

      - name: Ensure GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          # Check if Pages is configured
          PAGES_STATUS=$(gh api "repos/$REPO/pages" --jq '.status' 2>/dev/null || echo "not-found")
          echo "Pages status: $PAGES_STATUS"
          if [ "$PAGES_STATUS" = "not-found" ] || [ -z "$PAGES_STATUS" ]; then
            echo "Pages not configured, enabling..."
            gh api "repos/$REPO/pages" -X POST \
              --input - <<'EOF'
          {
            "build_type": "workflow",
            "source": {
              "branch": "main",
              "path": "/"
            }
          }
          EOF
            echo "Pages enabled"
          else
            echo "Pages already configured"
          fi

      - name: Verify HTTPS enforcement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          HTTPS_ENFORCED=$(gh api "repos/$REPO/pages" --jq '.https_enforced' 2>/dev/null || echo "unknown")
          echo "HTTPS enforced: $HTTPS_ENFORCED"
          if [ "$HTTPS_ENFORCED" != "true" ]; then
            echo "::warning::HTTPS not enforced on Pages"
          fi

  build:
    needs: verify-public
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4