<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe — 🥟 Community Recipe Book</title>
<meta name="description" content="A community recipe from our recipe book.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css">
<script src="./js/i18n.js"></script>
</head>
<body>

<nav class="nav">
  <a href="./" class="nav-brand" data-i18n="navBrand">🥟 Community Recipe Book</a>
  <div class="nav-links">
    <a href="./" data-i18n="navBrowse">Browse</a>
    <a href="./submit.html" data-i18n="navSubmit">Submit</a>
  </div>
</nav>

<main class="recipe-detail" id="recipeDetail">
  <div style="text-align:center;margin-bottom:16px;">
    <div class="lang-dropdown" id="langDropdown">
      <button class="lang-dropdown-btn" id="langDropdownBtn">🌐 English</button>
      <div class="lang-dropdown-menu" id="langDropdownMenu">
      </div>
    </div>
  </div>
  <a href="./" class="back-link" data-i18n="backToRecipes">← Back to all recipes</a>
  <div style="text-align:center;padding:60px 20px;color:var(--ink-muted);">
    <p>Loading recipe...</p>
  </div>
</main>

<footer class="footer">
  <p data-i18n="footer">🥟 Community Recipe Book — Celebrating food, family &amp; culture</p>
</footer>

<script>
// ── IndexedDB ──
const DB_NAME = 'CommunityRecipeBook';
const DB_VERSION = 1;
const STORE_NAME = 'recipes';

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: 'slug' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function getRecipe(slug) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const req = store.get(slug);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function renderRecipe() {
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');

  if (!slug) {
    window.location.href = './';
    return;
  }

  const recipe = await getRecipe(slug);

  const t = window.i18n.translations[window.i18n.detectLanguage()] || window.i18n.translations.en;

  if (!recipe) {
    document.getElementById('recipeDetail').innerHTML = `
      <a href="./" class="back-link">${t.backToRecipes}</a>
      <div class="no-results">
        <span class="emoji">🔍</span>
        <h3>${t.recipeNotFound}</h3>
        <p>${t.recipeNotFoundText}</p>
        <a href="./" class="submit-btn" style="display:inline-flex;text-decoration:none;margin-top:24px;width:auto;padding:12px 28px;font-size:1rem;">${t.browseAllRecipes}</a>
      </div>
    `;
    return;
  }

  const difficultyEmoji = { Easy: '😊', Intermediate: '🤔', Advanced: '👨‍🍳' }[recipe.difficulty] || '';
  const date = new Date(recipe.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });

  document.title = `${recipe.recipe_name} — Community Recipe Book`;

  const dietary = recipe.dietary || [];
  const allergens = recipe.allergens || [];

  document.getElementById('recipeDetail').innerHTML = `
    <a href="./" class="back-link">${t.backToRecipes}</a>

    ${recipe.photo
      ? `<img src="${escapeHtml(recipe.photo)}" alt="${escapeHtml(recipe.recipe_name)}" class="recipe-detail-image">`
      : `<div class="recipe-detail-placeholder">🥘</div>`
    }

    <h1>${escapeHtml(recipe.recipe_name)}</h1>

    <div class="meta">
      ${recipe.display_name ? `<span>👤 ${escapeHtml(recipe.display_name)}</span>` : ''}
      ${recipe.origin ? `<span>🌍 ${escapeHtml(recipe.origin)}</span>` : ''}
      <span>👥 ${t.servesLabel} ${escapeHtml(recipe.serves)}</span>
      ${recipe.prep_time ? `<span>⏱ ${t.prepLabel} ${escapeHtml(recipe.prep_time)}</span>` : ''}
      ${recipe.cook_time ? `<span>🔥 ${t.cookLabel} ${escapeHtml(recipe.cook_time)}</span>` : ''}
      ${recipe.difficulty ? `<span>${difficultyEmoji} ${escapeHtml(recipe.difficulty)}</span>` : ''}
    </div>

    ${recipe.story ? `<div class="story">${escapeHtml(recipe.story)}</div>` : ''}

    ${dietary.length ? `
      <div class="recipe-card-tags" style="margin-bottom:8px">
        ${dietary.map(d => `<span class="tag tag-dietary">${escapeHtml(d)}</span>`).join('')}
      </div>
    ` : ''}

    ${allergens.length ? `
      <div class="recipe-card-tags" style="margin-bottom:24px">
        ${allergens.map(a => `<span class="tag">${escapeHtml(a)}</span>`).join('')}
      </div>
    ` : ''}

    <h2>${t.ingredientsLabel}</h2>
    <div class="ingredients-list">${escapeHtml(recipe.ingredients)}</div>

    <h2>${t.methodLabel}</h2>
    <div class="method-text">${escapeHtml(recipe.method)}</div>

    ${recipe.serve_with ? `
      <h2>${t.serveWithLabel}</h2>
      <div class="method-text">${escapeHtml(recipe.serve_with)}</div>
    ` : ''}

    <p style="margin-top:32px;color:var(--ink-muted);font-size:0.85rem;">${t.addedLabel} ${date}</p>
  `;
}

// ── Language Dropdown ──
function buildLangDropdown() {
  const menu = document.getElementById('langDropdownMenu');
  const btn = document.getElementById('langDropdownBtn');
  const currentLang = window.i18n.detectLanguage();

  btn.textContent = '🌐 ' + window.i18n.LANG_NAMES[currentLang];

  window.i18n.SUPPORTED_LANGS.forEach(lang => {
    const item = document.createElement('a');
    item.href = 'javascript:void(0)';
    item.className = 'lang-dropdown-item' + (lang === currentLang ? ' active' : '');
    item.textContent = window.i18n.LANG_NAMES[lang];
    item.dataset.lang = lang;
    item.addEventListener('click', (e) => {
      e.preventDefault();
      window.i18n.setLanguage(lang);
      btn.textContent = '🌐 ' + window.i18n.LANG_NAMES[lang];
      const url = new URL(window.location);
      url.searchParams.set('lang', lang);
      history.replaceState(null, '', url);
      menu.classList.remove('open');
      menu.querySelectorAll('.lang-dropdown-item').forEach(i => i.classList.toggle('active', i.dataset.lang === lang));
      renderRecipe();
    });
    menu.appendChild(item);
  });

  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    menu.classList.toggle('open');
  });

  document.addEventListener('click', () => menu.classList.remove('open'));
}

// ── Init ──
const lang = window.i18n.detectLanguage();
window.i18n.setLanguage(lang);
buildLangDropdown();
renderRecipe();
</script>
</body>
</html>
