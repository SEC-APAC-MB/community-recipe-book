// ── IndexedDB ──
const DB_NAME = 'CommunityRecipeBook';
const DB_VERSION = 1;
const STORE_NAME = 'recipes';

function openDB() {
  return new Promise((resolve, reject) => {
    try {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          db.createObjectStore(STORE_NAME, { keyPath: 'slug' });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
      req.onblocked = () => reject(new Error('IndexedDB blocked'));
    } catch (err) {
      reject(err);
    }
  });
}

async function getRecipe(slug) {
  try {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const req = store.get(slug);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
      tx.oncomplete = () => {};
      tx.onerror = () => reject(tx.error);
    });
  } catch (err) {
    console.error('getRecipe failed:', err);
    return null;
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function seedIfEmpty() {
  try {
    const db = await openDB();
    // Check if DB already has recipes
    const count = await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const req = store.count();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    if (count > 0) return;
    // Seed demo recipes in a separate transaction
    await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      for (const recipe of DEMO_RECIPES) {
        store.put(recipe);
      }
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } catch (err) {
    console.error('seedIfEmpty failed:', err);
    // Continue even if seeding fails — recipe page still works without seed data
  }
}

async function renderRecipe() {
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');

  if (!slug) {
    window.location.href = './';
    return;
  }

  let recipe;
  try {
    await seedIfEmpty();
    recipe = await getRecipe(slug);
  } catch (err) {
    console.error('IndexedDB failed, using fallback:', err);
  }

  // Fallback: if IndexedDB failed, try DEMO_RECIPES directly
  if (!recipe) {
    recipe = DEMO_RECIPES.find(r => r.slug === slug) || null;
  }

  const t = window.i18n.translations[window.i18n.detectLanguage()] || window.i18n.translations.en;

    document.getElementById('main').innerHTML = `

      <div class="no-results">

        <p>${t.recipeNotFoundText}</p>

      </div>
    `;
    return;
  }

  const allergens = recipe.allergens || [];

function shareRecipe() {
  const url = window.location.href;
  if (navigator.share) {
    navigator.share({ title: document.title, url: url }).catch(() => {});
  } else {
    // Fallback: copy to clipboard
    navigator.clipboard.writeText(url).then(() => {
      const btn = document.querySelector('.recipe-action-btn');
      const orig = btn.innerHTML;
      btn.innerHTML = '<span class="icon">✅</span> Copied!';
      setTimeout(() => { btn.innerHTML = orig; }, 2000);
    }).catch(() => {
      // Ultimate fallback
      const input = document.createElement('input');
      input.value = url;
      document.body.appendChild(input);
      input.select();
      document.execCommand('copy');
      document.body.removeChild(input);
    });
  }
}

function addRecipeStructuredData(recipe) {
  // Remove any existing structured data
  const existing = document.getElementById('recipe-jsonld');
  if (existing) existing.remove();

  const ld = {
    "@context": "https://schema.org",
    "@type": "Recipe",
    "name": recipe.recipe_name,
    "author": recipe.display_name ? { "@type": "Person", "name": recipe.display_name } : undefined,
    "recipeYield": recipe.serves,
    "recipeIngredient": recipe.ingredients?.split('\n').filter(l => l.trim()) || [],
    "recipeInstructions": recipe.method?.split('\n').filter(l => l.trim()).map((step, i) => ({
      "@type": "HowToStep",
      "position": i + 1,
      "text": step.replace(/^\d+[\.\)]\s*/, '')
    })) || [],
  };

  if (recipe.prep_time) ld.prepTime = `PT${recipe.prep_time.replace(/[^0-9]/g, '')}M`;
  if (recipe.cook_time) ld.cookTime = `PT${recipe.cook_time.replace(/[^0-9]/g, '')}M`;
  if (recipe.difficulty) ld.recipeCategory = recipe.difficulty;
  if (recipe.origin) ld.recipeCuisine = recipe.origin;
  if (recipe.dietary?.length) ld.suitableForDiet = recipe.dietary;
  if (recipe.photo) ld.image = recipe.photo;

  const script = document.createElement('script');
  script.type = 'application/ld+json';
  script.id = 'recipe-jsonld';
  script.textContent = JSON.stringify(ld);
  document.head.appendChild(script);
}


// ── Language Dropdown ──
function buildLangDropdown() {
  const menu = document.getElementById('langDropdownMenu');
  const btn = document.getElementById('langDropdownBtn');
  const currentLang = window.i18n.detectLanguage();

  btn.textContent = '🌐 ' + window.i18n.LANG_NAMES[currentLang];

  window.i18n.SUPPORTED_LANGS.forEach(lang => {
    const item = document.createElement('a');
    item.href = 'javascript:void(0)';
    item.className = 'lang-dropdown-item' + (lang === currentLang ? ' active' : '');
    item.textContent = window.i18n.LANG_NAMES[lang];
    item.dataset.lang = lang;
    item.setAttribute('role', 'option');
    item.setAttribute('aria-selected', lang === currentLang ? 'true' : 'false');
    item.addEventListener('click', (e) => {
      e.preventDefault();
      window.i18n.setLanguage(lang);
      btn.textContent = '🌐 ' + window.i18n.LANG_NAMES[lang];
      btn.setAttribute('aria-expanded', 'false');
      const url = new URL(window.location);
      url.searchParams.set('lang', lang);
      history.replaceState(null, '', url);
      menu.classList.remove('open');
      menu.querySelectorAll('.lang-dropdown-item').forEach(i => {
        i.classList.toggle('active', i.dataset.lang === lang);
        i.setAttribute('aria-selected', i.dataset.lang === lang ? 'true' : 'false');
      });
      renderRecipe();
    });
    menu.appendChild(item);
  });

  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const isOpen = menu.classList.toggle('open');
    btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  });

  document.addEventListener('click', () => {
    menu.classList.remove('open');
    btn.setAttribute('aria-expanded', 'false');
  });

  btn.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      menu.classList.remove('open');
      btn.setAttribute('aria-expanded', 'false');
    }
  });
}
